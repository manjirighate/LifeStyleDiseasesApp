<!DOCTYPE html>
<html>
<head>
    <title>Manage Disease Symptoms</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .table-container{
            max-height: 420px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
{% include "top_doctor.html" %}

<div class="container mt-4">

    <h4 class="text-center mb-3">Disease – Symptom Management</h4>

    {% if msg %}
    <div class="alert alert-success alert-dismissible fade show text-center">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}

    <!-- TABS -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#report">
                📊 Mapping Report
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">
                ➕ Add Mapping
            </button>
        </li>
    </ul>

    <div class="tab-content border p-4">

        <!-- REPORT TAB -->
        <div class="tab-pane fade show active" id="report">

            <div class="table-container">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Disease</th>
                            <th>Symptom</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for m in mappings %}
                        <tr>
                            <td>{{ m.0 }}</td>
                            <td>{{ m.1 }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-center">No mappings found</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </div>

        <!-- REGISTER TAB -->
        <div class="tab-pane fade" id="register">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Select Disease</label>
                    <select name="disease_id" class="form-select" required>
                        <option value="">-- Select Disease --</option>
                        {% for d in diseases %}
                        <option value="{{ d.0 }}">{{ d.1 }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Symptoms</label>
                    <select name="symptom_ids" class="form-select" multiple size="8" required>
                        {% for s in symptoms %}
                        <option value="{{ s.0 }}">{{ s.1 }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Hold CTRL to select multiple symptoms</small>
                </div>

                <button class="btn btn-primary">
                    Save Mapping
                </button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
