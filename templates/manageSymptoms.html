<!DOCTYPE html>
<html>
<head>
    <title>Manage Symptoms</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<style>
.symptom-table-wrapper{
    max-height: 420px;          /* shows many rows */
    overflow-y: auto;
    border: 1px solid #dee2e6;
    border-radius: 12px;
}

/* Sticky header */
.symptom-table-wrapper thead th{
    position: sticky;
    top: 0;
    background: #212529;
    color: #fff;
    z-index: 2;
}

/* Compact rows */
.symptom-table-wrapper td,
.symptom-table-wrapper th{
    padding: 6px 10px;
    font-size: 14px;
}

/* Search box style */
.symptom-search{
    max-width: 300px;
}
</style>

</head>

<body>
{% include "top_doctor.html" %}
<div class="container mt-4">

    <h4 class="mb-3 text-center">Symptoms Management</h4>

{% if msg %}
<div class="alert alert-info alert-dismissible fade show text-center" role="alert">
    {{ msg }}
    <button type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"></button>
</div>
{% endif %}
    <!-- TABS -->
    <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#report">
                📊 Symptoms Report
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">
                ➕ Register Symptom
            </button>
        </li>
    </ul>

    <!-- TAB CONTENT -->
    <div class="tab-content border p-4">

        <!-- REPORT TAB -->
        <!-- REPORT TAB -->
<div class="tab-pane fade show active" id="report">

    <!-- Search -->
    <div class="d-flex justify-content-end mb-2">
        <input type="text"
               id="symptomSearch"
               class="form-control symptom-search"
               placeholder="Search symptom...">
    </div>

    <!-- Scrollable Table -->
    <div class="symptom-table-wrapper">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr>
                    <th>Symptom Name</th>
                </tr>
            </thead>
            <tbody>
                {% for s in symptoms %}
                <tr>
                    <td>{{ s.1 }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td class="text-center">No symptoms found</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>


        <!-- REGISTER TAB -->
        <div class="tab-pane fade" id="register">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Symptom Name</label>
                    <input type="text" name="symptom_name"
                           class="form-control"
                           placeholder="Eg: fever, headache, cough"
                           required>
                </div>

                <button class="btn btn-primary">
                    Add Symptom
                </button>
            </form>
        </div>

    </div>

</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$("#symptomSearch").on("keyup", function() {
    let value = $(this).val().toLowerCase();
    $("#report table tbody tr").filter(function() {
        $(this).toggle(
            $(this).text().toLowerCase().indexOf(value) > -1
        );
    });
});
</script>

</body>
</html>
