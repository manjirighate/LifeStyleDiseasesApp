<!DOCTYPE html>
<html>
<head>
    <title>Manage Doctor Diseases</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .table-container{
            max-height:420px;
            overflow-y:auto;
        }
    </style>
</head>

<body>
{% include "top_doctor.html" %}

<div class="container mt-4">

    <h4 class="text-center mb-3">Doctor – Disease Management</h4>

    {% if msg %}
    <div class="alert alert-success alert-dismissible fade show text-center">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}

    <!-- TABS -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#report">
                📊 Mapping Report
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">
                ➕ Add Mapping
            </button>
        </li>
    </ul>

    <div class="tab-content border p-4">

        <!-- REPORT TAB -->
        <div class="tab-pane fade show active" id="report">

            <div class="table-container">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                             
                            <th>Disease</th><th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for m in mappings %}
                        <tr>
                             
                            <td>{{ m.1 }}</td>
                            <td class="text-center">
        <a href="?delete_id={{ m.0 }}"
           class="btn btn-sm btn-danger"
           onclick="return confirm('Delete this mapping?')">
           Delete
        </a>
    </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-center">
                                No Treatable Diseases found
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </div>

        <!-- REGISTER TAB -->
        <div class="tab-pane fade" id="register">
            <form method="post">
                {% csrf_token %}
 

                <div class="mb-3">
                    <label class="form-label">Select Diseases</label>
                    <select name="disease_ids" class="form-select" multiple size="8" required>
                        {% for dis in diseases %}
                        <option value="{{ dis.0 }}">{{ dis.1 }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">
                        Hold CTRL to select multiple diseases
                    </small>
                </div>

                <button class="btn btn-primary">
                    Save 
                </button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
