<!DOCTYPE html>
<html lang="en">
<head>
    <title>Doctor Recommendation</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<style>
.content-box{
    background:#fff;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}
.search-card{
    padding:30px;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,0.12);
}
.suggestion-box {
    border: 1px solid #ddd;
    border-radius: 12px;
    margin-top: 5px;
    background: #fff;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.suggestion-item {
    padding: 12px 15px;
    cursor: pointer;
    transition: background 0.2s;
}
.suggestion-item:hover {
    background: #f1f5ff;
}

</style>

<script language="Javascript" type="text/javascript"> 

function createRequestObject() {
	var tmpXmlHttpObject;
	if (window.XMLHttpRequest) {
			tmpXmlHttpObject = new XMLHttpRequest();
	} else if (window.ActiveXObject) {
		tmpXmlHttpObject = new ActiveXObject("Microsoft.XMLHTTP");
	}

	return tmpXmlHttpObject;
}


var http = createRequestObject();

function makeGetRequest(st) {
   // st=document.frm.state.value;
   
	http.open('get', '/Cities?state=' + st);
	http.onreadystatechange = processResponse;
	http.send(null);
}
 
function processResponse() {
	if(http.readyState == 4){
		var response = http.responseText;
		document.getElementById('cities').innerHTML = response;
	}}
   
 
 
</script>
</head>

<body>

{% include "top_user.html" %}

<div class="container mt-4">
<div class="content-box">

<h4 class="mb-4 text-center">Find Best Doctor Near You</h4>

<!-- LOCATION SECTION -->
<h6>Select Location</h6>

<div class="alert alert-info mb-3">
    <strong>Your Registered Address:</strong><br>
    {{ list.0.5 }}, {{ list.0.8}}, {{ list.0.7 }} - {{ list.0.14 }}
</div>

<div class="form-check mb-2">
    <input class="form-check-input" type="radio" name="locationType"
           value="registered" checked>
    <label class="form-check-label">Use registered address</label>
</div>

<div class="form-check mb-3">
    <input class="form-check-input" type="radio" name="locationType"
           value="other">
    <label class="form-check-label">Use another address</label>
</div>

<div id="otherAddressBox" class="row g-3 d-none">
    <div class="col-md-6">
        <select id="state" class="form-control" onchange="makeGetRequest(this.value)">
            <option value="">-- Select State --</option>
            {% for rec in states %}
            {% for val in rec %}
            <option value="{{ val }}">{{ val }}</option>
            {% endfor %}
            {% endfor %}
        </select>
    </div>

    <div class="col-md-6">
        <div id="cities"></div>
    </div>

    <div class="col-md-8">
        <input type="text" id="address" class="form-control" placeholder="Address">
    </div>

    <div class="col-md-4">
        <input type="text" id="pincode" class="form-control" placeholder="Pincode">
    </div>
</div>

<hr>

<!-- SEARCH CARD -->
<div class="search-card mt-4">
    <label><strong>Who is the patient?</strong></label>
<div class="mb-3">
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio"
               name="patientType" value="self" checked>
        <label class="form-check-label">Myself</label>
    </div>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio"
               name="patientType" value="other">
        <label class="form-check-label">Someone Else</label>
    </div>
</div>
<div class="mb-3"><div id="ageBox" class="mb-3 d-none">
    <label class="form-label"><strong>Patient Age Range</strong></label>
    <select id="ageRange" class="form-select">
        <option value="">-- Select Age Range --</option>
        <option value="infant">0 – 2 years (Infant)</option>
        <option value="child">3 – 12 years (Child)</option>
        <option value="teen">13 – 18 years (Adolescent)</option>
        <option value="adult">19 – 59 years (Adult)</option>
        <option value="senior">60+ years (Senior)</option>
    </select></div>
</div>


<label><strong>Symptoms Duration</strong></label>
<div class="row mb-3">
    <div class="col-md-6">
        <input type="number" id="durationValue"
               class="form-control"
               placeholder="Eg: 5">
    </div>
    <div class="col-md-6">
        <select id="durationUnit" class="form-select">
            <option value="days">Days</option>
            <option value="weeks">Weeks</option>
            <option value="months">Months</option>
        </select>
    </div>
</div>

<label><strong>Enter Symptoms</strong></label>
<input type="text" id="symptoms"
       class="form-control form-control-lg"
       placeholder="Eg: fever, headache, chest pain"
       autocomplete="off">

<!-- SUGGESTIONS -->
<div id="suggestions" class="suggestion-box d-none"></div>
 
<div class="text-center mb-2">OR</div>

<label><strong>Select Speciality</strong></label>
<select id="speciality" class="form-select form-select-lg mb-3">
    <option value="">-- Select Speciality --</option>
    <option>Cardiologist</option>
    <option>Dentist</option>
    <option>Dermatologist</option>
    <option>ENT</option>
    <option>General Physician</option>
    <option>Neurologist</option>
    <option>Pediatrician</option>
    <option>Psychiatrist</option>
    <option>Orthopedic</option>
</select>

<button class="btn btn-primary btn-lg w-100"
        onclick="recommendDoctors()">
    Find Doctors
</button>

</div>

<!-- RESULT -->
<div id="doctorResult" class="mt-4"></div>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$("#symptoms").keyup(function(){
    let text = $(this).val();

    if(text.length < 2){
        $("#suggestions").addClass("d-none");
        return;
    }

    $.ajax({
        url: "/searchSymptoms/",
        type: "GET",
        data: { q: text },
        success: function(data){
            if(data.length > 0){
                let html = "";
                data.forEach(function(item){
                    html += `
                        <div class="suggestion-item"
                             onclick="selectSymptom('${item.symptom}')">
                            <strong>${item.symptom}</strong><br>
                            <small class="text-muted">
                                Related: ${item.disease}
                            </small>
                        </div>`;
                });
                $("#suggestions").html(html).removeClass("d-none");
            } else {
                $("#suggestions").addClass("d-none");
            }
        }
    });
});

function selectSymptom(symptom){
    $("#symptoms").val(symptom);
    $("#suggestions").addClass("d-none");
}
</script>

<script>
$("input[name='locationType']").change(function(){
    if($(this).val()==="other"){
        $("#otherAddressBox").removeClass("d-none");
    }else{
        $("#otherAddressBox").addClass("d-none");
    }
});

function getLocationData(){
    let type=$("input[name='locationType']:checked").val();
    if(type==="registered"){
        return {locationType:"registered"};
    }else{
        return {
            locationType:"other",
            state:$("#state").val(),
            city:$("#city").val(),
            address:$("#address").val(),
            pincode:$("#pincode").val()
        };
    }
}
function recommendDoctors(){
    let symptoms = $("#symptoms").val();
    let speciality = $("#speciality").val();

    let patientType = $("input[name='patientType']:checked").val();
    //let age = $("#patientAge").val();
    let ageRange = $("#ageRange").val();
    let durationValue = $("#durationValue").val();
    let durationUnit = $("#durationUnit").val();

    if(symptoms.length < 3 && speciality === ""){
        alert("Enter symptoms or select speciality");
        return;
    }

    if(patientType === "other" && age === ""){
        alert("Please enter patient age");
        return;
    }

    let locationData = getLocationData();

    $.ajax({
        url: "/recommendDoctors/",
        type: "GET",
        data: {
            symptoms: symptoms,
            speciality: speciality,
            patientType: patientType,
            ageRange: ageRange,
            durationValue: durationValue,
            durationUnit: durationUnit,
            ...locationData
        },
        success:function(html){
            $("#doctorResult").html(html);
        }
    });
}

</script>
<script>
    $("input[name='patientType']").change(function(){
    if($(this).val()==="other"){
        $("#ageBox").removeClass("d-none");
    } else {
        $("#ageBox").addClass("d-none");
        $("#patientAge").val("");
    }
});
 

</script>
</body>
</html>
